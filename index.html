<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор MS Access: ROAD-INFO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel для підтримки JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#1e293b] text-slate-100 font-sans overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
          const [tables, setTables] = React.useState({
            tblSuppliers: {
              name: "tblSuppliers (Довідник)",
              desc: "Довідник постачальників",
              fields: [
                { id: 'id_sup', name: "ID_Постачальника", type: "", isPK: false },
                { id: 'name_sup', name: "Назва_Компанії", type: "", isPK: false },
                { id: 'edrpou', name: "ЄДРПОУ", type: "", isPK: false }
              ]
            },
            tblMaterials: {
              name: "tblMaterials (Довідник)",
              desc: "Довідник матеріалів",
              fields: [
                { id: 'id_mat', name: "ID_Матеріалу", type: "", isPK: false },
                { id: 'name_mat', name: "Назва_Матеріалу", type: "", isPK: false },
                { id: 'unit', name: "Одиниця_Виміру", type: "", isPK: false }
              ]
            },
            tblDeliveries: {
              name: "tblDeliveries (Журнал)",
              desc: "Журнал постачання",
              fields: [
                { id: 'id_del', name: "ID_Постачання", type: "", isPK: false },
                { id: 'fk_sup', name: "FK_Постачальник", type: "", isPK: false },
                { id: 'fk_mat', name: "FK_Матеріал", type: "", isPK: false },
                { id: 'qty', name: "Обсяг_Тонн", type: "", isPK: false },
                { id: 'date', name: "Дата_Постачання", type: "", isPK: false }
              ]
            }
          });

          const [relations, setRelations] = React.useState([]);
          const [isModalOpen, setIsModalOpen] = React.useState(false);
          const [parentTable, setParentTable] = React.useState('');
          const [parentField, setParentField] = React.useState('');
          const [childField, setChildField] = React.useState('');
          const [enforceRI, setEnforceRI] = React.useState(false);
          const [cascadeDel, setCascadeDel] = React.useState(false);
          const [isSidebarOpen, setIsSidebarOpen] = React.useState(true);
          const [isTaskPassed, setIsTaskPassed] = React.useState(false);

          const handleTypeChange = (tableKey, fieldId, newType) => {
            setTables(prev => ({
              ...prev,
              [tableKey]: {
                ...prev[tableKey],
                fields: prev[tableKey].fields.map(f => f.id === fieldId ? { ...f, type: newType } : f)
              }
            }));
          };

          const handleSetPK = (tableKey, fieldId) => {
            setTables(prev => ({
              ...prev,
              [tableKey]: {
                ...prev[tableKey],
                fields: prev[tableKey].fields.map(f => f.id === fieldId ? { ...f, isPK: !f.isPK } : f)
              }
            }));
          };

          const handleCreateRelation = () => {
            if (!parentTable || !parentField || !childField) {
              alert("⚠️ Будь ласка, повністю заповніть усі поля зв'язку!");
              return;
            }
            if (relations.some(r => r.parent === parentTable)) {
              alert("⚠️ Зв'язок із цією таблицею-довідником уже створено!");
              return;
            }

            const newRel = {
              id: Date.now(),
              parent: parentTable,
              parentField: parentField,
              child: 'tblDeliveries',
              childField: childField,
              enforce: enforceRI,
              cascade: cascadeDel
            };
            setRelations([...relations, newRel]);
            setIsModalOpen(false);
            setParentTable('');
            setParentField('');
            setChildField('');
            setEnforceRI(false);
            setCascadeDel(false);
          };

          const handleRemoveRelation = (id) => {
            setRelations(relations.filter(r => r.id !== id));
            setIsTaskPassed(false);
          };

          const checkTask = () => {
            const supPK = tables.tblSuppliers.fields.find(f => f.name.includes("ID_Постачальника"))?.isPK;
            const matPK = tables.tblMaterials.fields.find(f => f.name.includes("ID_Матеріалу"))?.isPK;
            const delPK = tables.tblDeliveries.fields.find(f => f.name.includes("ID_Постачання"))?.isPK;

            if (!supPK || !matPK || !delPK) {
              alert("⚠️ Помилка: Встановіть первинні ключі (PK) для всіх трьох таблиць шляхом натискання на золотий ключ поруч із полем ID!");
              return;
            }

            const supFields = tables.tblSuppliers.fields;
            const matFields = tables.tblMaterials.fields;
            const delFields = tables.tblDeliveries.fields;

            if (
              supFields[0].type !== 'AutoNumber' || supFields[1].type !== 'Short Text' || supFields[2].type !== 'Number' ||
              matFields[0].type !== 'AutoNumber' || matFields[1].type !== 'Short Text' || matFields[2].type !== 'Short Text' ||
              delFields[0].type !== 'AutoNumber' || delFields[1].type !== 'Long Integer' || delFields[2].type !== 'Long Integer' || delFields[3].type !== 'Double' || delFields[4].type !== 'Date/Time'
            ) {
              alert("❌ Помилка утиліти типів даних! Деякі типи полів вказано невірно. Виправте типи даних згідно з інструкцією перед перевіркою.");
              return;
            }

            if (relations.length < 2) {
              alert("⚠️ Помилка: Створіть щонайменше два зв'язки між довідниками та журналом постачань!");
              return;
            }

            const allEnforced = relations.every(r => r.enforce);
            if (!allEnforced) {
              alert("⚠️ Помилка: Перевірте зв'язки! Для кожного зв'язку обов'язково має бути увімкнено прапорець «Забезпечення цілісності даних» (Enforce Referential Integrity).");
              return;
            }

            if (cascadeDel || relations.some(r => r.cascade)) {
              alert("❌ Увага! Увімкнено каскадне видалення (Cascade Delete). Це критично небезпечно для будівельного обліку! Вимкніть його.");
              return;
            }

            setIsTaskPassed(true);
            alert("Вітаємо! 🏆 Архітектура бази даних проєкту «ROAD-INFO» спроєктована ідеально. Усі типи даних обрано правильно, зв'язки типу 1:N налаштовано, цілісність даних забезпечено!");
          };

          const handleSendResult = async () => {
            const studentName = prompt("Введіть ваше Прізвище та Ім'я:");
            if (!studentName || studentName.trim() === "") {
              alert("⚠️ Надсилання скасовано: не вказано прізвище та ім'я.");
              return;
            }

            try {
              const response = await fetch("https://formspree.io/f/meaawkry", {
                method: "POST",
                headers: { "Accept": "application/json" },
                body: JSON.stringify({ 
                  Прізвище_Ім_я: studentName.trim(), 
                  status: "Успішно виконано проєктування БД ROAD-INFO" 
                })
              });
              if (response.ok) {
                alert(`✅ Дякуємо, ${studentName.trim()}! Результат успішно надіслано викладачу на пошту.`);
              } else {
                alert("⚠️ Помилка відправки. Спробуйте ще раз.");
              }
            } catch (error) {
              alert("⚠️ По мережі: не вдалося з'єднатися з сервером.");
            }
          };

          return (
            <div className="flex h-screen bg-[#0f172a] text-slate-100 font-sans overflow-hidden">
              <div className="flex-1 flex flex-col h-full overflow-y-auto p-6 relative">
                
                {/* Верхня панель Access */}
                <div className="bg-[#1b3635] border border-[#2b5351] rounded-lg p-4 mb-6 flex items-center justify-between shadow-lg">
                  <div>
                    <h1 className="text-lg font-bold text-emerald-400 flex items-center gap-2">
                      <span>🗄️ Симулятор MS Access: ROAD-INFO</span>
                    </h1>
                    <p className="text-xs text-slate-300">Облік матеріально-технічних ресурсів у дорожньому будівництві</p>
                  </div>
                  <div className="flex gap-3 items-center">
                    <button 
                      onClick={() => setIsModalOpen(true)}
                      className="bg-emerald-700 hover:bg-emerald-600 px-4 py-2 rounded text-sm font-semibold transition flex items-center gap-2 shadow text-white"
                    >
                      + Створити зв'язок
                    </button>
                    <button 
                      onClick={checkTask}
                      className="bg-sky-700 hover:bg-sky-600 px-4 py-2 rounded text-sm font-semibold transition shadow text-white"
                    >
                      Перевірити виконання 🚀
                    </button>

                    {isTaskPassed && (
                      <button 
                        onClick={handleSendResult}
                        className="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded text-sm font-semibold transition shadow text-white animate-pulse"
                      >
                        Результат надіслати викладачу ✉️
                      </button>
                    )}

                    <button 
                      onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                      className="bg-[#264644] hover:bg-[#325b58] px-3 py-2 rounded text-sm text-slate-200 transition"
                    >
                      {isSidebarOpen ? "Сховати інструкцію 👁️‍🗨️" : "Показати інструкцію 📖"}
                    </button>
                  </div>
                </div>

                {/* Полотно схеми даних */}
                <div className="relative bg-[#131e2d] border border-[#23354d] rounded-xl p-6 min-h-[520px] flex flex-col justify-between">
                  <div className="absolute top-3 left-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    Схема даних (Relationships): Налаштуйте зв'язки «Один-до-багатьох» (1:N) між довідниками та журналом постачань.
                  </div>

                  {/* SVG ЛІНІЇ ЗВ'ЯЗКІВ ТА ПІДПИСИ 1 та ∞ */}
                  <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                    {relations.map((rel, index) => {
                      const isSupplier = rel.parent === 'tblSuppliers';
                      const x1 = isSupplier ? 220 : 680;
                      const y1 = 190;
                      const x2 = 490;
                      const y2 = 270;
                      
                      return (
                        <g key={rel.id}>
                          <path 
                            d={`M ${x1} ${y1} C ${x1} 230, ${x2} 220, ${x2} ${y2}`} 
                            fill="none" 
                            stroke="#34d399" 
                            strokeWidth="2.5" 
                            strokeDasharray="4 2"
                          />
                          <circle cx={x1} cy={y1} r="4" fill="#34d399" />
                          <circle cx={x2} cy={y2} r="4" fill="#34d399" />
                          
                          {/* Чітка позначка «1» безпосередньо біля верхніх довідників */}
                          <text x={isSupplier ? x1 + 15 : x1 - 25} y={y1 - 15} fill="#34d399" fontSize="16" fontWeight="bold">1</text>
                          {/* Чітка позначка «∞» біля журналу */}
                          <text x={isSupplier ? x2 - 25 : x2 + 15} y={y2 - 10} fill="#f43f5e" fontSize="18" fontWeight="bold">∞</text>
                        </g>
                      );
                    })}
                  </svg>

                  {/* Верхній ряд таблиць */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-12 mt-6 z-20">
                    <div className="bg-[#162235] border border-[#273b59] rounded-lg shadow-xl overflow-hidden">
                      <div className="bg-[#1b3635] px-4 py-2 flex justify-between items-center text-xs font-bold text-emerald-300 border-b border-[#2b5351]">
                        <span>tblSuppliers (Довідник)</span>
                        <span className="text-[10px] text-slate-300 font-normal">Довідник постачальників</span>
                      </div>
                      <div className="p-3 space-y-2">
                        {tables.tblSuppliers.fields.map(field => (
                          <div key={field.id} className="flex items-center justify-between text-sm border-b border-slate-800/60 pb-1">
                            <div className="flex items-center gap-2">
                              <button 
                                onClick={() => handleSetPK('tblSuppliers', field.id)}
                                title="Встановити/зняти Первинний ключ (PK)"
                                className={`p-1 rounded transition ${field.isPK ? 'text-amber-400 bg-amber-400/10' : 'text-slate-600 hover:text-slate-400'}`}
                              >
                                🔑
                              </button>
                              <span className={field.isPK ? 'font-bold text-amber-300' : 'text-slate-200'}>{field.name}</span>
                            </div>
                            <select 
                              value={field.type} 
                              onChange={(e) => handleTypeChange('tblSuppliers', field.id, e.target.value)}
                              className="bg-[#1e293b] border border-slate-700 text-xs rounded px-2 py-1 text-slate-300 focus:outline-none focus:border-emerald-500"
                            >
                              <option value="">-- Оберіть тип --</option>
                              <option value="AutoNumber">Лічильник (AutoNumber)</option>
                              <option value="Short Text">Короткий текст (Short Text)</option>
                              <option value="Number">Числовий (Number)</option>
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-[#162235] border border-[#273b59] rounded-lg shadow-xl overflow-hidden">
                      <div className="bg-[#1b3635] px-4 py-2 flex justify-between items-center text-xs font-bold text-emerald-300 border-b border-[#2b5351]">
                        <span>tblMaterials (Довідник)</span>
                        <span className="text-[10px] text-slate-300 font-normal">Довідник матеріалів</span>
                      </div>
                      <div className="p-3 space-y-2">
                        {tables.tblMaterials.fields.map(field => (
                          <div key={field.id} className="flex items-center justify-between text-sm border-b border-slate-800/60 pb-1">
                            <div className="flex items-center gap-2">
                              <button 
                                onClick={() => handleSetPK('tblMaterials', field.id)}
                                title="Встановити/зняти Первинний ключ (PK)"
                                className={`p-1 rounded transition ${field.isPK ? 'text-amber-400 bg-amber-400/10' : 'text-slate-600 hover:text-slate-400'}`}
                              >
                                🔑
                              </button>
                              <span className={field.isPK ? 'font-bold text-amber-300' : 'text-slate-200'}>{field.name}</span>
                            </div>
                            <select 
                              value={field.type} 
                              onChange={(e) => handleTypeChange('tblMaterials', field.id, e.target.value)}
                              className="bg-[#1e293b] border border-slate-700 text-xs rounded px-2 py-1 text-slate-300 focus:outline-none focus:border-emerald-500"
                            >
                              <option value="">-- Оберіть тип --</option>
                              <option value="AutoNumber">Лічильник (AutoNumber)</option>
                              <option value="Short Text">Короткий текст (Short Text)</option>
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Нижній ряд (Журнал) */}
                  <div className="max-w-md mx-auto w-full mt-10 z-20">
                    <div className="bg-[#162235] border border-[#273b59] rounded-lg shadow-xl overflow-hidden">
                      <div className="bg-[#242b3d] px-4 py-2 flex justify-between items-center text-xs font-bold text-sky-300 border-b border-slate-700">
                        <span>tblDeliveries (Журнал)</span>
                        <span className="text-[10px] text-slate-300 font-normal">Журнал постачання</span>
                      </div>
                      <div className="p-3 space-y-2">
                        {tables.tblDeliveries.fields.map(field => (
                          <div key={field.id} className="flex items-center justify-between text-sm border-b border-slate-800/60 pb-1">
                            <div className="flex items-center gap-2">
                              <button 
                                onClick={() => handleSetPK('tblDeliveries', field.id)}
                                title="Встановити/зняти Первинний ключ (PK)"
                                className={`p-1 rounded transition ${field.isPK ? 'text-amber-400 bg-amber-400/10' : 'text-slate-600 hover:text-slate-400'}`}
                              >
                                🔑
                              </button>
                              <span className={field.isPK ? 'font-bold text-amber-300' : 'text-slate-200'}>{field.name}</span>
                            </div>
                            <select 
                              value={field.type} 
                              onChange={(e) => handleTypeChange('tblDeliveries', field.id, e.target.value)}
                              className="bg-[#1e293b] border border-slate-700 text-xs rounded px-2 py-1 text-slate-300 focus:outline-none focus:border-emerald-500"
                            >
                              <option value="">-- Оберіть тип --</option>
                              <option value="AutoNumber">Лічильник (AutoNumber)</option>
                              <option value="Long Integer">Довге ціле (Long Integer - для FK)</option>
                              <option value="Double">Числовий (Double)</option>
                              <option value="Date/Time">Дата/Час (Date/Time)</option>
                            </select>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Активні зв'язки */}
                  <div className="mt-8 bg-[#162235] border border-[#273b59] rounded-lg p-4">
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Активні зв'язки в системі ({relations.length})</h3>
                    {relations.length === 0 ? (
                      <p className="text-xs text-slate-500 italic">Зв'язків поки не створено. Натисніть кнопку «+ Створити зв'язок» вище.</p>
                    ) : (
                      <div className="space-y-2">
                        {relations.map(rel => (
                          <div key={rel.id} className="bg-[#0f172a] border border-slate-800 px-3 py-2 rounded flex items-center justify-between text-xs">
                            <div className="flex items-center gap-3">
                              <span className="font-semibold text-emerald-400">{rel.parent}</span>
                              <span className="text-slate-500">({rel.parentField})</span>
                              <span className="text-amber-400 font-bold"> 1 : ∞ </span>
                              <span className="font-semibold text-sky-400">{rel.child}</span>
                              <span className="text-slate-500">({rel.childField})</span>
                            </div>
                            <div className="flex items-center gap-4">
                              <span className={`px-2 py-0.5 rounded text-[10px] border ${rel.enforce ? 'bg-emerald-950 text-emerald-400 border-emerald-800/50' : 'bg-rose-950 text-rose-300 border-rose-900/50'}`}>
                                Цілісність: {rel.enforce ? 'УВІМКНЕНО' : 'ВИМКНЕНО'}
                              </span>
                              <span className="bg-rose-950 text-rose-300 border border-rose-900/50 px-2 py-0.5 rounded text-[10px]">
                                Каскадне видалення: Вимкнено (Безпечно)
                              </span>
                              <button 
                                onClick={() => handleRemoveRelation(rel.id)}
                                className="text-slate-500 hover:text-rose-400 transition"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>

              {/* Бічна панель інструкції */}
              {isSidebarOpen && (
                <div className="w-96 bg-[#162235] border-l border-[#273b59] flex flex-col h-full shadow-2xl overflow-y-auto p-5 text-sm">
                  <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                    <h2 className="font-bold text-emerald-400 flex items-center gap-2">
                      <span>📖 Інструкція до виконання</span>
                    </h2>
                    <button 
                      onClick={() => setIsSidebarOpen(false)}
                      className="text-slate-400 hover:text-slate-200 text-xs bg-[#242b3d] px-2 py-1 rounded"
                    >
                      ✕ Закрити
                    </button>
                  </div>

                  <div className="space-y-4 text-xs text-slate-300 leading-relaxed">
                    <div className="bg-[#0f172a] p-3 rounded border border-slate-800">
                      <h3 className="font-semibold text-amber-300 mb-1">🎯 Контекст проєкту «ROAD-INFO»:</h3>
                      <p>Ви – інженер-проєктувальник дорожньо-будівельної компанії. Ваше завдання – створити надійну реляційну базу даних у середовищі MS Access для обліку матеріально-технічних ресурсів (МТР) без дублювання та аномалій.</p>
                    </div>

                    <div>
                      <h3 className="font-semibold text-emerald-300 mb-1">🛠️ Покроковий алгоритм виконання:</h3>
                      <ol className="list-decimal list-inside space-y-2 text-slate-300">
                        <li>
                          <strong className="text-slate-100">Встановлення первинних ключів (PK):</strong> 
                          У довідниках <code className="text-amber-300">tblSuppliers</code> та <code className="text-amber-300">tblMaterials</code>, а також у журналі <code className="text-amber-300">tblDeliveries</code> встановіть ключові поля як PK типу <strong className="text-emerald-400">«Лічильник» (AutoNumber)</strong>, натиснувши на золотий ключ 🔑.
                        </li>
                        <li>
                          <strong className="text-slate-100">Вибір типів даних:</strong> 
                          Самостійно оберіть правильні типи для всіх полів (наприклад, для зовнішніх ключів <code className="text-sky-300">FK_...</code> в журналі оберіть тип <strong className="text-emerald-400">«Довге ціле» (Long Integer)</strong>). Без правильних типів система не зарахує виконання!
                        </li>
                        <li>
                          <strong className="text-slate-100">Налаштування зв'язків:</strong> 
                          <br/>• <strong>Перший зв'язок:</strong> Натисніть «+ Створити зв'язок», оберіть таблицю-довідник <code className="text-emerald-300">tblSuppliers</code>, її первинний ключ <code className="text-amber-300">ID_Постачальника</code>, у журналі оберіть <code className="text-sky-300">FK_Постачальник</code>, обов'язково увімкніть забезпечення цілісності та збережіть.
                          <br/>• <strong>Другий зв'язок:</strong> Натисніть «+ Створити зв'язок» ще раз і самостійно налаштуйте зв'язок між довідником матеріалів (<code className="text-emerald-300">tblMaterials</code>) та журналом (<code className="text-sky-300">tblDeliveries</code>), увімкнувши забезпечення цілісності.
                        </li>
                        <li>
                          <strong className="text-slate-100">Безпека даних:</strong> 
                          Переконайтеся, що опція каскадного видалення залишається вимкненою задля захисту історичних даних обліку.
                        </li>
                        <li>
                          <strong className="text-slate-100">Перевірка виконання:</strong> 
                          Натисніть кнопку <span className="text-sky-400 font-semibold">«Перевірити виконання 🚀»</span>.
                        </li>
                        <li>
                          <strong className="text-slate-100">Надсилання результатів:</strong> 
                          Після успішної перевірки натисніть кнопку «Результат надіслати викладачу».
                        </li>
                      </ol>
                    </div>

                    <div className="bg-rose-950/40 border border-rose-900/50 p-3 rounded text-rose-200">
                      <span className="font-bold">⚠️ Важливо:</span> Без увімкненої цілісності посилань, правильних типів та встановлених первинних ключів система видасть попередження!
                    </div>
                  </div>
                </div>
              )}

              {/* Модальне вікно налаштування зв'язку */}
              {isModalOpen && (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                  <div className="bg-[#162235] border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl">
                    <h3 className="text-base font-bold text-emerald-400 mb-4 flex items-center gap-2">
                      🔗 Налаштування зв'язку між таблицями
                    </h3>
                    
                    <div className="space-y-4 text-xs text-slate-300">
                      <div>
                        <label className="block text-slate-400 mb-1">1. Оберіть таблицю-довідник:</label>
                        <select 
                          value={parentTable} 
                          onChange={(e) => {
                            setParentTable(e.target.value);
                            setParentField('');
                            setChildField('');
                          }}
                          className="w-full bg-[#1e293b] border border-slate-700 rounded p-2 text-slate-200 focus:outline-none focus:border-emerald-500"
                        >
                          <option value="">-- Оберіть довідник --</option>
                          <option value="tblSuppliers">tblSuppliers (Довідник постачальників)</option>
                          <option value="tblMaterials">tblMaterials (Довідник матеріалів)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1">2. Оберіть поле Первинного ключа (PK):</label>
                        <select 
                          value={parentField} 
                          onChange={(e) => setParentField(e.target.value)}
                          className="w-full bg-[#1e293b] border border-slate-700 rounded p-2 text-amber-300 font-mono focus:outline-none focus:border-emerald-500"
                        >
                          <option value="">-- Оберіть поле PK --</option>
                          {parentTable === 'tblSuppliers' && (
                            <>
                              <option value="ID_Постачальника">ID_Постачальника</option>
                              <option value="Назва_Компанії">Назва_Компанії (Неправильно)</option>
                            </>
                          )}
                          {parentTable === 'tblMaterials' && (
                            <>
                              <option value="ID_Матеріалу">ID_Матеріалу</option>
                              <option value="Одиниця_Виміру">Одиниця_Виміру (Неправильно)</option>
                            </>
                          )}
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1">3. Журнальна таблиця:</label>
                        <input 
                          type="text" 
                          disabled 
                          value="tblDeliveries (Журнал постачання)" 
                          className="w-full bg-[#0f172a] border border-slate-800 rounded p-2 text-sky-300 font-mono"
                        />
                      </div>

                      <div>
                        <label className="block text-slate-400 mb-1">4. Оберіть зовнішній ключ (FK) у журналі:</label>
                        <select 
                          value={childField} 
                          onChange={(e) => setChildField(e.target.value)}
                          className="w-full bg-[#1e293b] border border-slate-700 rounded p-2 text-slate-200 focus:outline-none focus:border-emerald-500"
                        >
                          <option value="">-- Оберіть поле FK --</option>
                          {parentTable === 'tblSuppliers' && (
                            <option value="FK_Постачальник">FK_Постачальник</option>
                          )}
                          {parentTable === 'tblMaterials' && (
                            <option value="FK_Матеріал">FK_Матеріал</option>
                          )}
                        </select>
                      </div>

                      <div className="pt-2 border-t border-slate-800 space-y-2">
                        <label className="flex items-center gap-2 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={enforceRI} 
                            onChange={(e) => setEnforceRI(e.target.checked)}
                            className="rounded bg-slate-800 border-slate-700 text-emerald-600 focus:ring-emerald-500"
                          />
                          <span className="text-slate-200 font-medium">Забезпечення цілісності даних (Enforce Referential Integrity)</span>
                        </label>

                        <label className="flex items-center gap-2 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={cascadeDel} 
                            onChange={(e) => setCascadeDel(e.target.checked)}
                            className="rounded bg-slate-800 border-slate-700 text-rose-600 focus:ring-rose-500"
                          />
                          <span className="text-rose-300">Каскадне видалення зв'язаних записів (Cascade Delete) ⚠️</span>
                        </label>
                      </div>
                    </div>

                    <div className="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-800">
                      <button 
                        onClick={() => setIsModalOpen(false)}
                        className="bg-[#242b3d] hover:bg-[#2e374f] text-slate-300 px-4 py-2 rounded text-xs transition"
                      >
                        Скасувати
                      </button>
                      <button 
                        onClick={handleCreateRelation}
                        className="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded text-xs font-semibold transition"
                      >
                        Створити зв'язок
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
